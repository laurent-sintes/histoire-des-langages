name: Validation et publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Valider et fabriquer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    outputs:
      telemetry: ${{ steps.telemetry.outputs.artifact-id }}
      release-base: ${{ steps.release-base.outputs.sha }}
      publish-pages: ${{ steps.pages-decision.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Identifier la dernière publication Pages réussie
        id: release-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(node tools/git/pages.ts)"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Contrôler les versions depuis la dernière publication
        env:
          RELEASE_BASE: ${{ steps.release-base.outputs.sha }}
        run: pnpm git:work version-check "$RELEASE_BASE" "$GITHUB_SHA"
      - name: Contrôler les révisions du corpus depuis la dernière publication
        env:
          RELEASE_BASE: ${{ steps.release-base.outputs.sha }}
        run: node tools/performance/run.ts check-revisions tools/knowledge.ts check --against-ref "$RELEASE_BASE"
      - name: Décider si le site Pages doit être republié
        id: pages-decision
        env:
          RELEASE_BASE: ${{ steps.release-base.outputs.sha }}
        run: |
          publish="$(node tools/git/pages.ts requires-deploy "$RELEASE_BASE" "$GITHUB_SHA" "$GITHUB_EVENT_NAME")"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = false ]; then
            echo "Le diff depuis la dernière publication est limité au dossier audit/."
          fi
      - run: pnpm check
      - run: pnpm check:sources
      - run: pnpm extract:pdf tmp/preetude-ci.txt
      - run: pnpm build
      - name: Tester les outils et le site fabriqué
        env:
          KNOWLEDGE_USE_PREBUILT_SITE: 'true'
        run: |
          browser="$(command -v google-chrome)"
          "$browser" --version
          PLAYWRIGHT_CHROMIUM_EXECUTABLE="$browser" pnpm test
      - name: Préparer GitHub Pages
        if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true' && steps.pages-decision.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
      - name: Conserver les mesures de la session
        id: telemetry
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-${{ github.run_attempt }}
          path: tmp/performance/${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30

  history:
    name: Historiser les mesures et détecter les dérives
    needs: verify
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.verify.outputs.telemetry != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.verify.outputs.telemetry }}
          path: tmp/ci-measures/${{ github.sha }}
      - run: node tools/performance/archive.ts tmp/ci-measures "$GITHUB_SHA"

  deploy:
    name: Publier sur GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true' && needs.verify.outputs.publish-pages == 'true'
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Revérifier la référence de publication
        id: release-base
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_BASE: ${{ needs.verify.outputs.release-base }}
        run: |
          base="$(node tools/git/pages.ts)"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$base" = "$CHECKED_BASE" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v5
        if: steps.release-base.outputs.changed == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.release-base.outputs.changed == 'true'
      - name: Rejouer le contrôle de versions si la référence a changé
        if: steps.release-base.outputs.changed == 'true'
        env:
          RELEASE_BASE: ${{ steps.release-base.outputs.sha }}
        run: pnpm git:work version-check "$RELEASE_BASE" "$GITHUB_SHA"
      - name: Rejouer le contrôle des révisions si la référence a changé
        if: steps.release-base.outputs.changed == 'true'
        env:
          RELEASE_BASE: ${{ steps.release-base.outputs.sha }}
        run: node tools/performance/run.ts check-revisions tools/knowledge.ts check --against-ref "$RELEASE_BASE"
      - name: Vérifier que main pointe encore sur la cible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "Le commit $GITHUB_SHA a été remplacé sur main par $latest."
            exit 1
          fi
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
